<svg xmlns="http://www.w3.org/2000/svg" width="220" height="48" fill="none" viewBox="0 0 220 48">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Ledger Columns -->
    <rect x="8" y="10" width="5" height="24" rx="2.5" fill="#0F172A" fill-opacity="0.1" />
    <rect x="17" y="15" width="5" height="19" rx="2.5" fill="#0F172A" fill-opacity="0.2" />

    <!-- Flow line -->
    <path d="M 4 30 C 6 30, 7 12, 13 12 C 19 12, 17 26, 23 26 C 27 26, 29 20, 31 20" stroke="url(#flowGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Dots -->
    <circle cx="13" cy="12" r="1.5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1" />
    <circle cx="23" cy="26" r="1.5" fill="#FFFFFF" stroke="#06B6D4" stroke-width="1" />
  </g>

  <!-- FlowLedger Text -->
  <text x="44" y="31" fill="#0F172A" font-family="Inter, sans-serif" font-weight="700" font-size="20" letter-spacing="-0.02em">FlowLedger</text>
</svg>