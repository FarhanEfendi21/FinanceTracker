<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="180" height="180" rx="40" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <g transform="translate(15, 15) scale(1.5)">
    <!-- Glow -->
    <circle cx="50" cy="50" r="30" fill="url(#glowGrad)" filter="url(#blur)" />

    <!-- Ledger Columns -->
    <!-- Column 1 (Left) -->
    <rect x="28" y="25" width="12" height="50" rx="6" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
    <!-- Column 2 (Right) -->
    <rect x="48" y="35" width="12" height="40" rx="6" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />

    <!-- Flow line -->
    <path d="M 18 70 C 22 70, 24 30, 38 30 C 52 30, 48 60, 62 60 C 72 60, 76 46, 82 46" stroke="#2563EB" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.2" />
    <path d="M 18 70 C 22 70, 24 30, 38 30 C 52 30, 48 60, 62 60 C 72 60, 76 46, 82 46" stroke="url(#flowGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Dots -->
    <circle cx="38" cy="30" r="3.5" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" />
    <circle cx="62" cy="60" r="3.5" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2" />
  </g>
</svg>